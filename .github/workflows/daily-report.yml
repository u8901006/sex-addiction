name: Sex Addiction Research Daily Report

on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), leave empty for today'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'

      - name: Determine date
        id: date
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ] && echo "$INPUT_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "target=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(TZ=Asia/Taipei date +%Y-%m-%d)
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch papers from PubMed
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}
        run: |
          node scripts/fetch_papers.js \
            --days 7 \
            --max-papers 40 \
            --output papers.json
        continue-on-error: true

      - name: Check papers data
        id: papers
        run: |
          if [ -f papers.json ] && grep -q '"count"' papers.json; then
            COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('papers.json','utf8'));console.log(d.count||0)")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            if [ "$COUNT" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No new papers; report generation is skipped."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            printf '{"date":"%s","count":0,"papers":[]}' "${{ steps.date.outputs.target }}" > papers.json
          fi

      - name: Configure NVIDIA Nemotron backend
        if: steps.papers.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("scripts/generate_report.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace("https://open.bigmodel.cn/api/coding/paas/v4", "https://integrate.api.nvidia.com/v1")
          for old, new in [
              ("GLM-5-Turbo", "nvidia/nemotron-3-super-120b-a12b"),
              ("glm-5-turbo", "nvidia/nemotron-3-super-120b-a12b"),
              ("GLM-4.7-Flash", "nvidia/nemotron-3-nano-30b-a3b"),
              ("glm-4.7-flash", "nvidia/nemotron-3-nano-30b-a3b"),
              ("GLM-4.7", "nvidia/nemotron-3-nano-30b-a3b"),
              ("glm-4.7", "nvidia/nemotron-3-nano-30b-a3b"),
          ]:
              s = s.replace(old, new)
          s = re.sub(r"const MAX_TOKENS = [0-9_]+;", "const MAX_TOKENS = 16384;", s)
          s = re.sub(r"max_tokens:\s*[0-9_]+,", "max_tokens: 16384,", s)
          s = s.replace("temperature: 0.3", "temperature: 1.0")
          s = s.replace("top_p: 0.9", "top_p: 0.95")
          marker = "max_tokens: MAX_TOKENS,"
          if marker in s and "chat_template_kwargs" not in s:
              s = s.replace(marker, marker + "\n          chat_template_kwargs: { enable_thinking: false },", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate report with NVIDIA Nemotron
        if: steps.papers.outputs.skip != 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TARGET_DATE: ${{ steps.date.outputs.target }}
        run: |
          test -n "$ZHIPU_API_KEY" || { echo "::error::Missing NVIDIA_API_KEY repository secret"; exit 1; }
          node scripts/generate_report.js \
            --input papers.json \
            --output "docs/sex-addiction-${{ steps.date.outputs.target }}.html" \
            --date "$TARGET_DATE"

      - name: Generate index page
        if: steps.papers.outputs.skip != 'true'
        run: node scripts/generate_index.js

      - name: Commit and push
        if: steps.papers.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: sex addiction daily report ${{ steps.date.outputs.target }}"
          git pull --rebase origin main
          git push

      - name: Summary
        if: always()
        run: |
          echo "### Sex Addiction Research Daily Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** ${{ steps.date.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Papers analyzed:** ${{ steps.papers.outputs.count || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.papers.outputs.skip }}" = "true" ]; then
            echo "**Status:** No new papers; generation skipped successfully." >> "$GITHUB_STEP_SUMMARY"
          fi
